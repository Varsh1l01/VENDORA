# VENDORA core stack.  Usage:  make env && make up
# Infrastructure ports are NOT published here; see docker-compose.dev.yml.
name: vendora

x-app: &app
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/app/server", "-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s
  stop_grace_period: 20s

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (run make env)}
  KAFKA_BROKERS: kafka:9092

services:
  api-gateway:
    <<: *app
    build: { context: ., args: { SERVICE: api-gateway } }
    image: vendora/api-gateway:local
    ports: ["8080:8080"]
    environment:
      <<: *common-env
      USER_SERVICE_ADDR: user-service:50051
      PRODUCT_SERVICE_ADDR: product-service:50052
      CART_SERVICE_ADDR: cart-service:50053
      ORDER_SERVICE_ADDR: order-service:50054
      PAYMENT_SERVICE_ADDR: payment-service:50055
      INVENTORY_SERVICE_ADDR: inventory-service:50056
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-20}
      RATE_LIMIT_WRITE_PER_MIN: ${RATE_LIMIT_WRITE_PER_MIN:-120}
      RATE_LIMIT_READ_PER_MIN: ${RATE_LIMIT_READ_PER_MIN:-600}
    depends_on:
      user-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      cart-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }

  user-service:
    <<: *app
    build: { context: ., args: { SERVICE: user-service } }
    image: vendora/user-service:local
    environment:
      <<: *common-env
      USER_DB_URL: postgres://${POSTGRES_USER:-vendora}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/users_db?sslmode=disable
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  product-service:
    <<: *app
    build: { context: ., args: { SERVICE: product-service } }
    image: vendora/product-service:local
    environment:
      <<: *common-env
      PRODUCT_DB_URL: postgres://${POSTGRES_USER:-vendora}:${POSTGRES_PASSWORD}@postgres:5432/products_db?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  cart-service:
    <<: *app
    build: { context: ., args: { SERVICE: cart-service } }
    image: vendora/cart-service:local
    environment:
      <<: *common-env
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PRODUCT_SERVICE_ADDR: product-service:50052
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      product-service: { condition: service_healthy }

  inventory-service:
    <<: *app
    build: { context: ., args: { SERVICE: inventory-service } }
    image: vendora/inventory-service:local
    environment:
      <<: *common-env
      INVENTORY_DB_URL: postgres://${POSTGRES_USER:-vendora}:${POSTGRES_PASSWORD}@postgres:5432/inventory_db?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  order-service:
    <<: *app
    build: { context: ., args: { SERVICE: order-service } }
    image: vendora/order-service:local
    environment:
      <<: *common-env
      ORDER_DB_URL: postgres://${POSTGRES_USER:-vendora}:${POSTGRES_PASSWORD}@postgres:5432/orders_db?sslmode=disable
      CART_SERVICE_ADDR: cart-service:50053
      PRODUCT_SERVICE_ADDR: product-service:50052
      INVENTORY_SERVICE_ADDR: inventory-service:50056
      ORDER_PAYMENT_TIMEOUT: ${ORDER_PAYMENT_TIMEOUT:-15m}
      ORDER_PENDING_TIMEOUT: ${ORDER_PENDING_TIMEOUT:-2m}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      cart-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }

  payment-service:
    <<: *app
    build: { context: ., args: { SERVICE: payment-service } }
    image: vendora/payment-service:local
    environment:
      <<: *common-env
      PAYMENT_DB_URL: postgres://${POSTGRES_USER:-vendora}:${POSTGRES_PASSWORD}@postgres:5432/payments_db?sslmode=disable
      ORDER_SERVICE_ADDR: order-service:50054
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      order-service: { condition: service_healthy }

  notification-service:
    <<: *app
    build: { context: ., args: { SERVICE: notification-service } }
    image: vendora/notification-service:local
    environment:
      <<: *common-env
      NOTIFICATION_DB_URL: postgres://${POSTGRES_USER:-vendora}:${POSTGRES_PASSWORD}@postgres:5432/notifications_db?sslmode=disable
      USER_SERVICE_ADDR: user-service:50051
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@vendora.local}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      user-service: { condition: service_healthy }

  postgres:
    image: postgres:15.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vendora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    healthcheck:
      # notifications_db is created last by the init script; checking it
      # avoids reporting healthy before initialisation finished.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d notifications_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Single-node Kafka in KRaft mode (no ZooKeeper). Topics are created
  # explicitly by the services; broker-side auto-creation is disabled.
  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  kafka_data:
