syntax = "proto3";

package payment;

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (Payment);
  rpc GetPayment(GetPaymentRequest) returns (Payment);
  rpc UpdatePaymentStatus(UpdatePaymentStatusRequest) returns (Payment);
}

message Payment {
  string id = 1;
  string order_id = 2;
  string user_id = 3;
  double amount = 4;
  string status = 5; // pending, succeeded, failed
  string created_at = 6;
}

message CreatePaymentRequest {
  string order_id = 1;
  string user_id = 2;
  double amount = 3;
}

message GetPaymentRequest { string order_id = 1; }

message UpdatePaymentStatusRequest {
  string id = 1;
  string status = 2;
}
