syntax = "proto3";

package vendora.product.v1;

import "google/protobuf/timestamp.proto";

// ProductService owns the catalog. Stock is owned by InventoryService.
service ProductService {
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc BatchGetProducts(BatchGetProductsRequest) returns (BatchGetProductsResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  // DeleteProduct is a soft delete (the product becomes inactive).
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  // Price in minor currency units (cents).
  int64 price_cents = 4;
  string currency = 5;
  string image_url = 6;
  bool is_active = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  int64 price_cents = 3;
  string image_url = 4;
  // Initial stock, provisioned asynchronously in InventoryService via the
  // product.created event.
  int32 initial_stock = 5;
}

message CreateProductResponse {
  Product product = 1;
}

message GetProductRequest {
  string id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message BatchGetProductsRequest {
  repeated string ids = 1;
}

message BatchGetProductsResponse {
  // Only products that exist are returned (active or not).
  repeated Product products = 1;
}

message ListProductsRequest {
  int32 page_size = 1;
  // Opaque cursor returned as next_page_token by a previous call.
  string page_token = 2;
}

message ListProductsResponse {
  repeated Product products = 1;
  string next_page_token = 2;
}

// UpdateProductRequest has PATCH semantics: unset fields are left unchanged.
message UpdateProductRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional int64 price_cents = 4;
  optional string image_url = 5;
  optional bool is_active = 6;
}

message UpdateProductResponse {
  Product product = 1;
}

message DeleteProductRequest {
  string id = 1;
}

message DeleteProductResponse {}
