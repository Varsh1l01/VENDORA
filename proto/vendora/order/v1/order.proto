syntax = "proto3";

package vendora.order.v1;

import "google/protobuf/timestamp.proto";

// OrderService orchestrates the checkout saga.
service OrderService {
  // CreateOrder checks out the caller's cart. Idempotent per
  // (user_id, idempotency_key).
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  // CancelOrder cancels an order that has not been paid yet.
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  // UpdateOrderStatus performs fulfilment transitions (admin).
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_AWAITING_PAYMENT = 2;
  ORDER_STATUS_CONFIRMED = 3;
  ORDER_STATUS_SHIPPED = 4;
  ORDER_STATUS_DELIVERED = 5;
  ORDER_STATUS_CANCELLED = 6;
  ORDER_STATUS_REJECTED = 7;
}

message OrderItem {
  string product_id = 1;
  string name = 2;
  int64 unit_price_cents = 3;
  int32 quantity = 4;
  int64 line_total_cents = 5;
}

message Order {
  string id = 1;
  string user_id = 2;
  OrderStatus status = 3;
  repeated OrderItem items = 4;
  int64 total_cents = 5;
  string currency = 6;
  string shipping_address = 7;
  string status_reason = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateOrderRequest {
  string user_id = 1;
  string idempotency_key = 2;
  string shipping_address = 3;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
  // Caller's user id; enforced unless the caller is an admin or a service.
  string user_id = 2;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}

message CancelOrderRequest {
  string id = 1;
  string user_id = 2;
}

message CancelOrderResponse {
  Order order = 1;
}

message UpdateOrderStatusRequest {
  string id = 1;
  OrderStatus status = 2;
}

message UpdateOrderStatusResponse {
  Order order = 1;
}
